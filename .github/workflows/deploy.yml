name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/catalyst_builder/package-lock.json
      - run: npm ci
        working-directory: src/catalyst_builder
      - run: npm run build
        working-directory: src/catalyst_builder
      # The repo is a user-site (*.github.io), so Pages serves from the domain
      # root. Astro builds with base=/catalyst_builder (flat dist/, prefixed
      # links), so stage the artifact with the site nested at that path.
      - name: Stage Pages artifact
        run: |
          mkdir -p pages/catalyst_builder
          cp -R src/catalyst_builder/dist/. pages/catalyst_builder/
          cp src/catalyst_builder/public/robots.txt pages/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
